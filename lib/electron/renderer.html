<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>DSH Live2D Deskpet</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; }
  </style>
</head>
<body>
  <!--
    The Cubism 4 runtime must exist as a global before the renderer bundle evaluates it, so the
    pet host serves it at a fixed path and this placeholder decides whether it is worth loading.
  -->
  <script src="./core.js"></script>
  <!--
    soullink 注入层必须在 renderer.js 之前求值：它把 Live2DCubismCore.Model.fromMoc
    包一层，好让 pld 建出来的模型在每次 update() 之前接收情绪参数。加载失败（404 或
    脚本抛错）不影响后面任何东西——renderer.js 会照常接管，行为退回 0.1.9。
  -->
  <script src="./soullink-inject.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
